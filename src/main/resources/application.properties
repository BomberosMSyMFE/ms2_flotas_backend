# =========================================================================
# CONFIGURACIÓN MS-02 FLOTAS Y RUTAS (SPRING BOOT 3 / POSTGIS)
# =========================================================================
spring.application.name=ms2_flotas_backend
server.port=${SERVER_PORT:8080}

# Conexión a PostgreSQL con PostGIS
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bomberos_flotas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración SSO / JWT Compartido (PUNTO_12 y PUNTO_13)
jwt.secret=${JWT_SECRET:super_secreto_bomberos_jwt_key_nataly_2026_uagrm}
jwt.algorithm=${JWT_ALGORITHM:HS256}
jwt.cookie-name=${COOKIE_NAME:token_sesion}

# Configuración JPA / Hibernate Spatial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Actuator & Healthcheck
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.bo.gob.bomberos.flota=INFO
logging.level.org.hibernate.SQL=DEBUG
