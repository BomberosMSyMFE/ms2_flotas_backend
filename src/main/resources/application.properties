# =========================================================================
# CONFIGURACIÓN MS-02 FLOTAS Y RUTAS (SPRING BOOT 3 / POSTGIS)
# =========================================================================
spring.application.name=ms2_flotas_backend
server.port=8080

# Conexión a PostgreSQL con PostGIS
spring.datasource.url=jdbc:postgresql://localhost:5432/bomberos_flotas_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate Spatial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Actuator & Healthcheck
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.bo.gob.bomberos.flota=INFO
logging.level.org.hibernate.SQL=DEBUG
